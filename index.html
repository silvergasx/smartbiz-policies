<title>SmartBiz Pro - السياسات والشروط</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
    background: linear-gradient(135deg, #283593, #5C6BC0);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    text-align: center;
  }
  h1 { color: #283593; margin-bottom: 10px; font-size: 28px; }
  .subtitle { color: #666; margin-bottom: 30px; }
  .link-btn {
    display: block;
    background: linear-gradient(135deg, #283593, #5C6BC0);
    color: #fff;
    text-decoration: none;
    padding: 16px;
    border-radius: 12px;
    margin: 12px 0;
    font-weight: bold;
    font-size: 16px;
    transition: transform 0.2s;
  }
  .link-btn:hover { transform: translateY(-2px); }
  .en-link {
    background: linear-gradient(135deg, #5C6BC0, #7986CB);
  }
</style>
</head>

<div class="card">
